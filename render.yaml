services:
  # ─────────────────────────────────────────────────────────────
  # Backend API + WebSockets Service
  # ─────────────────────────────────────────────────────────────
  - type: web
    name: secure-sms-backend
    env: node
    rootDir: backend
    buildCommand: npm install --production
    startCommand: npm start
    healthCheckPath: /api/health
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: CLIENT_URL
        value: "*"
      - key: MONGODB_URI
        value: mongodb+srv://onlinepannipuri_db_user:PidrhZGQAcjWLJsY@cluster0.kni5bvp.mongodb.net/secure_sms_dashboard?retryWrites=true&w=majority&appName=Cluster0
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

  # ─────────────────────────────────────────────────────────────
  # Web Dashboard Frontend (React + Vite)
  # ─────────────────────────────────────────────────────────────
  - type: static
    name: secure-sms-web
    rootDir: web
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://secure-sms-backend.onrender.com/api
      - key: VITE_SOCKET_URL
        value: https://secure-sms-backend.onrender.com
